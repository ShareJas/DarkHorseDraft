<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draft · Dark Horses</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="draft-page">
  <div class="wrap wrap-wide">
    <header class="top">
      <div class="brand">
        <div id="avatar" class="avatar"></div>
        <div>
          <h1 id="hello">Draft board</h1>
          <p class="muted" id="meta"></p>
        </div>
      </div>
      <div class="row">
        <a class="btn btn-gray" href="/questionnaire.html">Questionnaire</a>
        <a class="btn btn-gray" href="/profile.html">Profile</a>
        <a id="adminLink" class="btn btn-amber" href="/admin.html" hidden>Admin</a>
        <button id="logoutBtn" class="btn-outline" type="button">Log out</button>
      </div>
    </header>
    <div id="bootBanner" class="flash warn">Loading board…</div>
    <div id="lockBanner" class="flash warn" hidden>Draft is locked.</div>
    <div class="card">
      <h2>You're up</h2>
      <p class="muted">Only blocks where you are first and a station is still open.</p>
      <div id="nextUp" class="row"></div>
    </div>
    <div class="card">
      <h2>Master calendar</h2>
      <div style="overflow-x:auto"><table class="cal" id="master"></table></div>
    </div>
    <div class="card">
      <h2>Your picks</h2>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Station</th><th>Block</th><th></th></tr></thead>
          <tbody id="myPicks"></tbody>
        </table>
      </div>
    </div>
  </div>
  <div id="modal" class="modal-bg">
    <div class="modal">
      <h2>Pick a station</h2>
      <p id="modalSlot" class="muted"></p>
      <div id="modalList"></div>
      <div class="actions">
        <button id="passBtn" class="btn-gray" type="button">Pass (end of line)</button>
        <button id="closeModal" class="btn-outline" type="button">Close</button>
      </div>
    </div>
  </div>
  <footer>Dark Horses · draft</footer>
  <script type="module">
    import { firebaseReady } from "/firebase.js";
    import {
      timeslots, timeBuckets, days, generateAvatar, timeslotDocId, roleFromType,
      bucketsForShift, shiftTouchesSlot, findShiftByName, shiftsOverlap,
      userWantsSlot, slotHasOpenStation, MAX_PICKS, MAX_PER_TYPE
    } from "/data.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, collection, onSnapshot, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const { ready, auth, db } = await firebaseReady;
    if (!ready) throw new Error("firebase not ready");
    const adminish = (v) => v === true || String(v).toLowerCase() === "true";
    let uid = null, me = {}, names = {}, activeSlot = null;
    let shiftRows = [], queues = {}, draftLocked = false;
    let paintTimer = null, listenersOn = false, haveShifts = false, haveSlots = false, lastPaintKey = "";
    const chipLimit = window.matchMedia("(max-width: 720px)").matches ? 2 : 4;
    function entryFor(user) {
      return { userId: user.uid || uid, name: user.fullName || user.email || uid };
    }
    function schedulePaint() {
      if (!haveShifts || !haveSlots || !uid) return;
      clearTimeout(paintTimer);
      paintTimer = setTimeout(() => requestAnimationFrame(paint), 120);
    }
    function startLive() {
      if (listenersOn) return;
      listenersOn = true;
      onSnapshot(collection(db, "shifts"), (snap) => {
        shiftRows = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        haveShifts = true; schedulePaint();
      });
      onSnapshot(collection(db, "timeslots"), (snap) => {
        queues = {};
        snap.forEach((d) => {
          const data = d.data();
          queues[data.bucket] = data.queue || [];
          (data.queue || []).forEach((p) => { if (p.userId && p.name) names[p.userId] = p.name; });
        });
        haveSlots = true; schedulePaint();
      });
      onSnapshot(doc(db, "users", uid), (snap) => {
        if (!snap.exists()) return location.replace("/index.html");
        me = { uid, ...snap.data() };
        names[uid] = me.fullName || me.email || uid;
        const av = generateAvatar(names[uid]);
        const el = document.getElementById("avatar");
        el.textContent = av.initials; el.style.background = av.color;
        document.getElementById("hello").textContent = me.fullName || "Draft";
        document.getElementById("adminLink").hidden = !adminish(me.isAdmin);
        schedulePaint();
      });
      onSnapshot(doc(db, "settings", "global"), (snap) => {
        draftLocked = snap.data()?.draftLocked === true;
        schedulePaint();
      });
    }
    onAuthStateChanged(auth, (user) => {
      if (!user) return location.replace("/index.html");
      uid = user.uid; startLive();
    });
    function paint() {
      if (!uid || !haveShifts || !haveSlots) return;
      const picks = me.picks || [];
      const paintKey = `${draftLocked}|${picks.join(",")}|${shiftRows.map((s) => s.pickedBy || "").join(".")}|${Object.values(queues).map((q) => (q[0] && q[0].userId) || "").join(".")}`;
      if (paintKey === lastPaintKey) return;
      lastPaintKey = paintKey;
      const boot = document.getElementById("bootBanner");
      if (boot) boot.hidden = true;
      const lockedOut = draftLocked && !adminish(me.isAdmin);
      document.getElementById("lockBanner").hidden = !lockedOut;
      document.getElementById("meta").textContent = `${picks.length}/${MAX_PICKS} picks · max ${MAX_PER_TYPE} per type · live`;
      document.getElementById("myPicks").innerHTML = picks.length
        ? picks.map((p) => {
            const known = findShiftByName(p);
            return `<tr><td>${p}</td><td>${known ? known.timeBucket : p}</td><td><button type="button" class="btn-red" data-release="${p}">Release</button></td></tr>`;
          }).join("")
        : `<tr><td colspan="3" class="muted">None yet</td></tr>`;
      document.querySelectorAll("[data-release]").forEach((btn) => {
        btn.onclick = () => releaseShift(btn.getAttribute("data-release"));
      });
      const shiftMap = {};
      shiftRows.forEach((s) => {
        bucketsForShift(s).forEach((bucket) => {
          const [day, time] = String(bucket).split(" ");
          if (!time || !day) return;
          if (!shiftMap[time]) shiftMap[time] = {};
          if (!shiftMap[time][day]) shiftMap[time][day] = [];
          if (!shiftMap[time][day].some((x) => x.id === s.id)) shiftMap[time][day].push(s);
        });
      });
      const next = document.getElementById("nextUp"); next.innerHTML = "";
      if (lockedOut) next.innerHTML = '<p class="muted">Draft is locked.</p>';
      else {
        const mine = [];
        Object.entries(queues).forEach(([bucket, queue]) => {
          if (queue.findIndex((q) => q.userId === uid) !== 0) return;
          if (slotHasOpenStation(bucket, shiftRows, picks)) mine.push({ bucket });
        });
        mine.sort((a, b) => timeslots.indexOf(a.bucket) - timeslots.indexOf(b.bucket));
        if (!mine.length) {
          next.innerHTML = picks.length >= MAX_PICKS
            ? '<p class="muted">You already have 4 picks.</p>'
            : '<p class="muted">You are not first in any open block.</p>';
        }
        mine.forEach((m) => {
          const btn = document.createElement("button");
          btn.type = "button"; btn.className = "btn-primary"; btn.textContent = `Pick ${m.bucket}`;
          btn.disabled = picks.length >= MAX_PICKS; btn.onclick = () => openModal(m.bucket);
          next.appendChild(btn);
        });
      }
      let html = "<thead><tr><th>Time</th>" + days.map((d) => `<th>${d}</th>`).join("") + "</tr></thead><tbody>";
      timeBuckets.forEach((time) => {
        const hour = Number(time.slice(0, 4));
        const meal = hour < 1100 ? "breakfast" : hour < 1700 ? "lunch" : "dinner";
        html += `<tr class="${meal}"><td><strong>${time}</strong></td>`;
        days.forEach((day) => {
          const slot = `${day} ${time}`;
          if (!timeslots.includes(slot)) { html += "<td class='muted'>—</td>"; return; }
          const list = shiftMap[time]?.[day] || [];
          let cell = "<table class='sub'>";
          list.forEach((s) => {
            const who = s.pickedBy ? (s.pickedByName || names[s.pickedBy] || "Taken") : "Open";
            const cls = s.pickedBy === uid ? "mine" : (s.pickedBy ? "taken" : "open");
            cell += `<tr class="${cls}"><td>${s.type}</td><td>${who}</td></tr>`;
          });
          cell += "<tr><td colspan='2'>";
          (queues[slot] || []).slice(0, chipLimit).forEach((p) => {
            const av = generateAvatar(p.name || p.userId);
            cell += `<span class="queue-chip" title="${p.name || ""}" style="background:${av.color}">${av.initials}</span>`;
          });
          cell += "</td></tr></table>"; html += `<td>${cell}</td>`;
        });
        html += "</tr>";
      });
      document.getElementById("master").innerHTML = html + "</tbody>";
      if (document.getElementById("modal").classList.contains("show") && activeSlot) fillModal();
    }
    function openModal(slot) {
      activeSlot = slot;
      document.getElementById("modalSlot").textContent = slot;
      document.getElementById("modal").classList.add("show");
      fillModal();
    }
    function fillModal() {
      const list = document.getElementById("modalList"); list.innerHTML = "";
      const rows = shiftRows.filter((s) => shiftTouchesSlot(s, activeSlot) && !s.pickedBy && !shiftsOverlap(s, me.picks || []));
      if (!rows.length) { list.innerHTML = '<p class="muted">No open stations left in this block.</p>'; return; }
      rows.forEach((row) => {
        const btn = document.createElement("button");
        btn.type = "button"; btn.className = "btn-primary pick-choice";
        btn.textContent = row.type === "0900 Food" ? "0900 Food (covers 8:30 and 9:30)" : row.type;
        btn.onclick = () => pick(row.id);
        list.appendChild(btn);
      });
    }
    async function pick(shiftId) {
      try {
        await runTransaction(db, async (tx) => {
          const shiftRef = doc(db, "shifts", shiftId);
          const userRef = doc(db, "users", uid);
          const shiftSnap = await tx.get(shiftRef);
          const userSnap = await tx.get(userRef);
          if (!shiftSnap.exists()) throw new Error("Shifts are missing. Admin: Initialize shifts.");
          const shift = { id: shiftSnap.id, ...shiftSnap.data() };
          const user = userSnap.data() || {};
          const buckets = bucketsForShift(findShiftByName(shift.shiftName) || shift);
          const needAll = (user.picks || []).length + 1 >= MAX_PICKS;
          const tsRefs = (needAll ? timeslots : buckets).map((b) => doc(db, "timeslots", timeslotDocId(b)));
          const tsSnaps = [];
          for (const ref of tsRefs) tsSnaps.push(await tx.get(ref));
          if (shift.pickedBy) throw new Error("Already taken.");
          if ((user.picks || []).length >= MAX_PICKS) throw new Error(`Max ${MAX_PICKS} picks.`);
          const role = roleFromType(shift.type);
          const count = (user.picks || []).filter((p) => roleFromType(p) === role).length;
          if (count >= MAX_PER_TYPE) throw new Error(`Max ${MAX_PER_TYPE} ${role} shifts.`);
          if (shiftsOverlap(findShiftByName(shift.shiftName) || shift, user.picks || [])) throw new Error("That station overlaps a block you already picked.");
          const activeRef = doc(db, "timeslots", timeslotDocId(activeSlot));
          const activeSnap = tsSnaps.find((s) => s.id === activeRef.id);
          if ((activeSnap?.data()?.queue || [])[0]?.userId !== uid) throw new Error("Not your turn in this block.");
          const picks = [...(user.picks || []), shift.shiftName];
          tx.update(shiftRef, { pickedBy: uid, pickedByName: user.fullName || user.email || uid });
          tx.update(userRef, { picks, done: picks.length >= MAX_PICKS });
          tsSnaps.forEach((snap, i) => {
            if (!snap.exists()) return;
            tx.update(tsRefs[i], { queue: (snap.data().queue || []).filter((x) => x.userId !== uid) });
          });
        });
        document.getElementById("modal").classList.remove("show");
      } catch (err) { alert(err.message); }
    }
    async function releaseShift(shiftName) {
      if (!confirm(`Release ${shiftName}?`)) return;
      try {
        const known = findShiftByName(shiftName);
        const shiftId = known?.id || shiftName.replace(/\s+/g, "_");
        await runTransaction(db, async (tx) => {
          const shiftRef = doc(db, "shifts", shiftId);
          const userRef = doc(db, "users", uid);
          const shiftSnap = await tx.get(shiftRef);
          const userSnap = await tx.get(userRef);
          if (!shiftSnap.exists()) throw new Error("Could not find that shift. Re-initialize shifts.");
          const shift = { id: shiftSnap.id, ...shiftSnap.data() };
          if (shift.pickedBy && shift.pickedBy !== uid) throw new Error("That station is not yours.");
          const user = userSnap.data() || {};
          const hadAllFour = (user.picks || []).length >= MAX_PICKS || user.done === true;
          const picks = (user.picks || []).filter((p) => p !== shiftName && p !== shift.shiftName);
          const homeBuckets = bucketsForShift(known || shift);
          const slotList = hadAllFour ? timeslots : homeBuckets;
          const imagined = shiftRows.map((s) => (s.id === shiftId || s.shiftName === shiftName ? { ...s, pickedBy: null } : s));
          const tsRefs = slotList.map((b) => doc(db, "timeslots", timeslotDocId(b)));
          const tsSnaps = [];
          for (const ref of tsRefs) tsSnaps.push(await tx.get(ref));
          tx.update(shiftRef, { pickedBy: null, pickedByName: null });
          tx.update(userRef, { picks, done: false });
          const meEntry = entryFor(user);
          tsSnaps.forEach((snap, i) => {
            if (!snap.exists()) return;
            const slot = slotList[i];
            let queue = (snap.data().queue || []).filter((x) => x.userId !== uid);
            const eligible = !hadAllFour || (userWantsSlot({ uid, ...user }, slot) && slotHasOpenStation(slot, imagined, picks));
            if (eligible) queue.splice(Math.min(1, queue.length), 0, meEntry);
            tx.update(tsRefs[i], { queue });
          });
        });
      } catch (err) { alert(err.message); }
    }
    document.getElementById("passBtn").onclick = async () => {
      if (!activeSlot || !confirm("Pass this block? You go to the end of its line.")) return;
      try {
        await runTransaction(db, async (tx) => {
          const tsRef = doc(db, "timeslots", timeslotDocId(activeSlot));
          const snap = await tx.get(tsRef);
          const queue = snap.data()?.queue || [];
          if (queue[0]?.userId !== uid) throw new Error("Not your turn.");
          const first = queue.shift(); queue.push(first);
          tx.update(tsRef, { queue });
        });
        document.getElementById("modal").classList.remove("show");
      } catch (err) { alert(err.message); }
    };
    document.getElementById("closeModal").onclick = () => document.getElementById("modal").classList.remove("show");
    document.getElementById("logoutBtn").onclick = async () => { await signOut(auth); location.href = "/index.html"; };
  </script>
</body>
</html>
