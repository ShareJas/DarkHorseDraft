<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark Horses Shift Draft</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="wrap" style="max-width: 520px;">
    <header class="top">
      <div class="brand">
        <h1>Dark Horses Draft Fall 2026</h1>
      </div>
    </header>

    <p class="muted" style="margin-bottom: 16px;">
      Login Page.
    </p>

    <div id="guestView">
      <div class="card">
        <h2>Create account</h2>
        <label for="regName">Full name</label>
        <input id="regName" type="text" autocomplete="name" placeholder="Nathan Deolloz" />
        <label for="regEmail">Email</label>
        <input id="regEmail" type="email" autocomplete="email" placeholder="jeevacation@gmail.com" />
        <label for="regPhone">Phone</label>
        <input id="regPhone" type="tel" inputmode="tel" placeholder="5128675309" />
        <label for="regPassword">Password (at least 6 characters)</label>
        <input id="regPassword" type="password" autocomplete="new-password" />
        <div class="actions">
          <button id="registerBtn" class="btn-primary" type="button">Register</button>
        </div>
      </div>

      <div class="card">
        <h2>Log in</h2>
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" />
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" />
        <div class="actions">
          <button id="loginBtn" class="btn-green" type="button">Log in</button>
        </div>
      </div>
    </div>

    <div id="signedInView" hidden></div>
    <div id="status"></div>
  </div>
  <footer>Created by Jason Sharer. Head waiter 2025-2027. V2.0.1</footer>

  <script type="module">
    import { firebaseReady } from "/firebase.js";
    import {
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const statusEl = document.getElementById("status");
    const guestView = document.getElementById("guestView");
    const signedInView = document.getElementById("signedInView");

    function friendlyError(err) {
      const code = err?.code || "";
      if (code.includes("email-already-in-use")) return "That email already has an account. Log in instead.";
      if (code.includes("invalid-email")) return "That email does not look valid.";
      if (code.includes("weak-password")) return "Password must be at least 6 characters.";
      if (code.includes("invalid-credential") || code.includes("wrong-password") || code.includes("user-not-found")) {
        return "Email or password is wrong.";
      }
      if (code.includes("operation-not-allowed")) {
        return "Email/Password sign-in is not enabled. Turn it on in Firebase Console → Authentication.";
      }
      return err.message || "Something went wrong.";
    }

    function showStatus(message, kind) {
      statusEl.innerHTML = message
        ? `<div class="flash ${kind || "ok"}">${message}</div>`
        : "";
    }

    function emptyUserDoc({ email, phone, fullName }) {
      return {
        email,
        phone: phone || "",
        fullName: fullName || "",
        seniority: 0,
        availability: {},
        prefs: {},
        picks: [],
        done: false,
        approved: true,
        isAdmin: false,
        createdAt: serverTimestamp()
      };
    }

    function renderSignedIn(data, email) {
      guestView.hidden = true;
      signedInView.hidden = false;
      signedInView.innerHTML = `
        <div class="card">
          <h2>You're in</h2>
          <p><strong>${data.fullName || email}</strong></p>
          <p class="muted">${email}</p>
          <p class="muted">Account saved. Next, setup your profile</p>
          <div class="actions">
            <a class="btn btn-primary" href="/profile.html">Continue to profile</a>
            <button id="logoutBtn" class="btn-outline" type="button">Log out</button>
          </div>
        </div>
      `;
      document.getElementById("logoutBtn").onclick = () => signOut(auth);
    }

    const boot = await firebaseReady;
    const { ready, auth, db } = boot;

    if (!ready) {
      document.getElementById("configBanner").hidden = false;
    }

    document.getElementById("registerBtn").onclick = async () => {
      if (!ready) return showStatus("Firebase is not connected yet.", "err");
      const fullName = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const phone = document.getElementById("regPhone").value.trim();
      const password = document.getElementById("regPassword").value;
      if (!email || password.length < 6) {
        return showStatus("Email and a password of at least 6 characters are required.", "err");
      }
      try {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "users", cred.user.uid), emptyUserDoc({ email, phone, fullName }));
        showStatus("Account created.", "ok");
      } catch (err) {
        showStatus(friendlyError(err), "err");
      }
    };

    document.getElementById("loginBtn").onclick = async () => {
      if (!ready) return showStatus("Firebase is not connected yet.", "err");
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      if (!email || !password) return showStatus("Enter email and password.", "err");
      try {
        await signInWithEmailAndPassword(auth, email, password);
      } catch (err) {
        showStatus(friendlyError(err), "err");
      }
    };

    if (ready) {
      onAuthStateChanged(auth, async (user) => {
        if (!user) {
          guestView.hidden = false;
          signedInView.hidden = true;
          signedInView.innerHTML = "";
          return;
        }
        const ref = doc(db, "users", user.uid);
        let snap = await getDoc(ref);
        if (!snap.exists()) {
          await setDoc(ref, emptyUserDoc({
            email: user.email || "",
            phone: "",
            fullName: ""
          }));
          snap = await getDoc(ref);
        }
        renderSignedIn(snap.data() || {}, user.email);
      });
    }
  </script>
</body>
</html>
